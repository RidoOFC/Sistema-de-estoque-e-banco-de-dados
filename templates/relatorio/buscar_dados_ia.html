<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Estoque IA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 800px; margin: auto; }
        .texto-ia { font-size: 16px; color: #333; line-height: 1.6; }
        .texto-ia h3 { color: #4F46E5; margin-top: 20px; }
        .texto-ia ul { padding-left: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 Relatório de Estoque (Gerado por IA)</h2>
        <hr>
        
        <!-- AQUI ESTÁ O SEGREDO: A barra vertical e a palavra 'safe' -->
        <div class="texto-ia">
            {{ relatorio | safe }}
        </div>
    </div>
</body>
</html>
